<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sfida la Laureata</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<h1>Sfida la Laureata</h1>

<div class="boss-portrait-wrap">
    <div class="boss-portrait" id="bossPortrait">
        <img id="bossPortraitImg" alt="La Laureata">
    </div>
    <div class="boss-name-tag">🐉 LA LAUREATA — BOSS FINALE</div>
</div>

<div class="hp-bar-wrap" id="hpBarWrap"><div class="hp-bar" id="hpBar" style="width:100%"></div></div>
<div class="hp-label" id="hpLabel">HP 100/100</div>

<div id="joinScreen" class="card center">
    <h3>Come ti chiami?</h3>
    <input type="text" id="nameInput" placeholder="Il tuo nome" maxlength="24">
    <br>
    <button class="primary" id="joinBtn">Entra in gioco</button>
</div>

<div id="gameScreen" style="display:none; width:100%; max-width:480px;">
    <div class="status" id="statusLine">In attesa...</div>
    <div id="winnerBanner" class="winner-banner" style="display:none;"></div>
    <div class="card" id="questionCard" style="display:none;">
        <h3 id="questionText"></h3>
        <div class="options" id="optionsBox"></div>
    </div>

    <div id="duelScreen" style="display:none;">
        <h2 id="duelChallengerLine" class="center"></h2>
        <div class="card center" id="wheelCard" style="display:none;">
            <div class="wheel-wrap" id="wheelWrap"></div>
            <div class="status">La festeggiata sta girando la ruota...</div>
        </div>
        <div class="card" id="duelChallengeCard" style="display:none;">
            <h3 id="duelCategoryTitle"></h3>
            <div id="duelMedia"></div>
            <div class="options" id="duelOptionsBox"></div>
            <div class="status" id="duelSpectatorNote"></div>
        </div>
        <div class="card center" id="duelResultCard" style="display:none;">
            <div id="duelResultBanner"></div>
        </div>
    </div>

    <div class="card center" id="penanceScreen" style="display:none;">
        <h3>Ruota delle Penitenze</h3>
        <div class="status">La festeggiata sta cercando di guadagnare HP extra!</div>
        <div class="wheel-wrap" id="penanceWheelWrap" style="display:none;"></div>
        <div id="penanceRevealBox" style="display:none;">
            <p id="penanceRevealText" style="font-size:1.1rem; font-weight:700;"></p>
            <div class="status" id="penanceRevealHeal"></div>
        </div>
    </div>

    <div class="card center">
        <h3>Classifica</h3>
        <table class="leaderboard" id="leaderboard"></table>
    </div>
</div>

<script src="/static/js/wheel.js"></script>
<script src="/static/js/gallery.js"></script>
<script src="/static/js/guest.js"></script>
</body>
</html>
