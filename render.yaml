services:
  - type: web
    name: laurea-party-game
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: BOSS_KEY
        generateValue: true
      - key: PUBLIC_URL
        value: ""
